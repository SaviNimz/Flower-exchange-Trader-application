<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #dddddd;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
            color: #555;
            text-transform: uppercase;
        }

        td {
            color: #666;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        @media only screen and (max-width: 600px) {
            table {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <!-- <img src="../static/execution.jpg" style="max-width: 100%;"> -->
    <h1>Execution Report</h1>
    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Client Order ID</th>
                <th>Instrument</th>
                <th>Side</th>
                <th>Execution Status</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Reason</th>
            </tr>
        </thead>
        <tbody>
            {% for row in csv_content[2:] %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
                <td>{{ row[4] }}</td>
                <td>{{ row[5] }}</td>
                <td>{{ row[6] }}</td>
                <td>{{ row[7] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
